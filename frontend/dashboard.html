<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Clínica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="d-flex">
    <!-- SIDEBAR -->
    <aside class="sidebar p-3 d-flex flex-column">
      <h5 class="text-white mb-4"><i class="bi bi-heart-pulse-fill"></i> Clínica</h5>
      <ul class="nav nav-pills flex-column gap-1" id="menu">
        <li><a class="nav-link active" href="#" data-section="resumen"><i class="bi bi-speedometer2 me-2"></i>Resumen</a></li>
        <li><a class="nav-link" href="#" data-section="pacientes"><i class="bi bi-people me-2"></i>Pacientes</a></li>
        <li><a class="nav-link" href="#" data-section="medicos"><i class="bi bi-person-badge me-2"></i>Médicos</a></li>
        <li><a class="nav-link" href="#" data-section="reservas"><i class="bi bi-calendar-check me-2"></i>Reservas</a></li>
        <li class="admin-only d-none"><a class="nav-link" href="#" data-section="usuarios"><i class="bi bi-shield-lock me-2"></i>Usuarios</a></li>
      </ul>
      <a href="index.html" class="nav-link text-white-50 mt-auto"><i class="bi bi-house me-2"></i>Inicio</a>
    </aside>

    <!-- CONTENIDO -->
    <main class="flex-grow-1">
      <nav class="navbar bg-white shadow-sm px-4">
        <span class="navbar-text fw-semibold" id="pageTitle">Resumen</span>
        <div class="d-flex align-items-center gap-3">
          <span id="userName" class="text-muted"></span>
          <button class="btn btn-outline-danger btn-sm" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> Salir
          </button>
        </div>
      </nav>

      <div class="p-4">
        <!-- RESUMEN -->
        <section id="sec-resumen">
          <div class="row g-3 mb-4">
            <div class="col-md-4"><div class="card stat-card shadow-sm"><div class="card-body">
              <small class="text-muted">Pacientes</small><h2 id="cntPacientes">-</h2></div></div></div>
            <div class="col-md-4"><div class="card stat-card shadow-sm"><div class="card-body">
              <small class="text-muted">Médicos</small><h2 id="cntMedicos">-</h2></div></div></div>
            <div class="col-md-4"><div class="card stat-card shadow-sm"><div class="card-body">
              <small class="text-muted">Citas de hoy</small><h2 id="cntHoy">-</h2></div></div></div>
          </div>
          <div class="card shadow-sm">
            <div class="card-header bg-white fw-semibold">Citas de hoy</div>
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead><tr><th>Hora</th><th>Paciente</th><th>Médico</th><th>Estado</th></tr></thead>
                <tbody id="tbHoy"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- PACIENTES -->
        <section id="sec-pacientes" class="d-none">
          <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between">
              <input type="search" id="buscarPaciente" class="form-control w-50" placeholder="Buscar por nombre...">
            </div>
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead><tr><th>Nombre</th><th>Teléfono</th><th>Email</th><th>Activo</th></tr></thead>
                <tbody id="tbPacientes"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- Las demás secciones se agregan igual (siguiente fase) -->
        <section id="sec-medicos" class="d-none"><p class="text-muted">Próximamente.</p></section>
        <section id="sec-reservas" class="d-none"><p class="text-muted">Próximamente.</p></section>
        <section id="sec-usuarios" class="d-none"><p class="text-muted">Próximamente.</p></section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
